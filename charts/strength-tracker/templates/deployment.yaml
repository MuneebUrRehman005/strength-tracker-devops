apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strength-tracker.fullname" . }}
  labels:
    app.kubernetes.io/name: strength-tracker
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: strength-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strength-tracker
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          stdin: true
          tty: true
          ports:
            - containerPort: 8080